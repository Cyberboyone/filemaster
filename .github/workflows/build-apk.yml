name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        working-directory: file_master
        run: flutter pub get

      - name: Patch plugin build files (AGP 9 compatibility)
        run: bash tool/patch-plugins.sh

      - name: Analyze
        working-directory: file_master
        run: flutter analyze

      - name: Test
        working-directory: file_master
        run: flutter test

      - name: Show version from pubspec
        working-directory: file_master
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "::warning::Building version $VER  (name=${VER%%+*}  code=${VER##*+})"

      - name: Build release AAB and APK
        working-directory: file_master
        env:
          GRADLE_OPTS: "-Xmx8G -XX:MaxMetaspaceSize=2G"
          JAVA_OPTS: "-Xmx8G -XX:MaxMetaspaceSize=2G"
        run: |
          set +e
          (while true; do echo "$(date +%T) $(free -m | awk '/Mem:/{print $2\"MB total \"$7\"MB avail\"}')" >> mem_trace.log; sleep 10; done) &
          MON=$!
          flutter build appbundle --release > build.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then
            flutter build apk --release >> build.log 2>&1
            RC=$?
          fi
          kill $MON 2>/dev/null
          if [ $RC -ne 0 ]; then
            echo "::error::MEM_TRACE = $(tr '\n' ' | ' < mem_trace.log)"
            echo "::error::BUILD_TAIL = $(tail -15 build.log | tr '\n' ' | ')"
          fi
          tail -35 build.log
          exit $RC

      - name: Verify versionCode in AAB
        working-directory: file_master
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          BT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo "aapt2 not found, skipping"; exit 0; fi
          CODE=$("$BT" dump badging "$AAB" 2>/dev/null | grep -oE "versionCode='[0-9]+'" | grep -oE "[0-9]+" | head -1)
          echo "::warning::AAB versionCode = $CODE"
          if [ "$CODE" = "1" ] || [ -z "$CODE" ]; then
            echo "::error::versionCode is $CODE — version was not injected. Aborting."
            exit 1
          fi

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: file-master-aab
          path: file_master/build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK (direct install)
        uses: actions/upload-artifact@v4
        with:
          name: file-master-apk
          path: file_master/build/app/outputs/flutter-apk/app-release.apk
