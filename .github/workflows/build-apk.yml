name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        working-directory: file_master
        run: flutter pub get

      - name: Patch plugin build files (AGP 9 compatibility)
        run: bash tool/patch-plugins.sh

      - name: Analyze
        working-directory: file_master
        run: flutter analyze

      - name: Test
        working-directory: file_master
        run: flutter test

      - name: Diagnostic - runner memory and Gradle JVM args
        run: |
          set +e
          echo "::warning::RAM=$(free -h | awk '/Mem:/{print $2" total, "$7" avail"}' | tr -d '\n') CPUS=$(nproc)"
          echo "=== gradle.properties ==="
          cat file_master/android/gradle.properties
          cd file_master/android
          ARGS=$(./gradlew help --info --no-daemon 2>&1 | grep -iE "xmx|metaspace|jvm arguments" | head -6 | tr '\n' ' | ')
          echo "::warning::DAEMON_ARGS = $ARGS"
          true

      - name: Build APK (debug)
        working-directory: file_master
        run: |
          set +e
          (while true; do echo "$(date +%T) $(free -m | awk '/Mem:/{print $2"MB total "$7"MB avail"}')" >> mem_trace.log; sleep 10; done) &
          MON=$!
          flutter build apk --debug > build.log 2>&1
          RC=$?
          kill $MON 2>/dev/null
          if [ $RC -ne 0 ]; then
            echo "::error::MEM_TRACE = $(tr '\n' ' | ' < mem_trace.log)"
            echo "::error::BUILD_TAIL = $(tail -8 build.log | tr '\n' ' | ')"
          fi
          tail -30 build.log
          exit $RC

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: file-master-apk
          path: file_master/build/app/outputs/flutter-apk/app-debug.apk
