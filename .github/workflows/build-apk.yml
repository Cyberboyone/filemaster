name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        working-directory: file_master
        run: flutter pub get

      - name: Patch plugin build files (AGP 9 compatibility)
        run: bash tool/patch-plugins.sh

      - name: Analyze
        working-directory: file_master
        run: flutter analyze

      - name: Test
        working-directory: file_master
        run: flutter test

      - name: Diagnostic - runner memory and Gradle JVM args
        run: |
          set +e
          echo "=== free -h ==="
          free -h
          echo "=== gradle.properties ==="
          cat file_master/android/gradle.properties
          echo "=== gradle daemon jvm args ==="
          cd file_master/android
          ./gradlew help --info --no-daemon 2>&1 | grep -iE "xmx|xx:|daemon|starting build|memory|heap" | head -30
          true

      - name: Build APK (debug)
        working-directory: file_master
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4G -XX:MaxMetaspaceSize=1G"
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: file-master-apk
          path: file_master/build/app/outputs/flutter-apk/app-debug.apk
